:root{--bg:#FBF4E6;--fg:#3A2A22;--wine:#7A1F2B;--gold:#C9A659;--line:#E4D8C0;--card:#ffffff;--sub:#5A4636;color-scheme:light}

body{margin:0;background:var(--bg);color:var(--fg);font-family:'Noto Sans JP',system-ui,sans-serif;line-height:1.6;padding-block:0 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.head{display:flex;align-items:center;gap:12px;padding:12px 14px}

.store{font-size:13px;color:var(--sub)}
.name{font-family:'Noto Serif JP',serif;font-weight:700;font-size:20px;line-height:1.3}
.card img{display:block;width:100%;aspect-ratio:4/3;height:auto;object-fit:contain;background:#ffffff;border-top:1px solid var(--line)}
.info{background:var(--wine);color:#fff;border-radius:12px;padding:20px 18px;display:flex;flex-direction:column;gap:10px;text-align:center}
.info h2{margin:0;font-family:'Noto Serif JP',serif;font-size:20px}
.price{font-family:'Noto Serif JP',serif;font-size:34px;font-weight:700;color:#F3E3B8;line-height:1.2}
.info p{margin:0;font-size:14px}
